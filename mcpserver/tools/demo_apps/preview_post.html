<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="color-scheme" content="light dark"/>
  <title>Post Preview</title>
  <style>
    :root {
      --color-background-primary: #fff;
      --color-background-secondary: rgba(63,67,80,0.04);
      --color-text-primary: #3f4350;
      --color-text-secondary: rgba(63,67,80,0.72);
      --color-border-primary: rgba(63,67,80,0.16);
      --color-background-info: #1c58d9;
      --color-text-inverse: #fff;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    [data-theme="dark"] {
      --color-background-primary: #1b1d22;
      --color-background-secondary: rgba(255,255,255,0.06);
      --color-text-primary: #ddd;
      --color-text-secondary: rgba(221,221,221,0.72);
      --color-border-primary: rgba(255,255,255,0.16);
      --color-background-info: #166de0;
      --color-text-inverse: #fff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--color-background-primary);
      color: var(--color-text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.45;
    }
    #status {
      padding: 12px 14px;
      color: var(--color-text-secondary);
      font-size: 12px;
    }
    #card {
      display: none;
      margin: 8px;
      padding: 12px 14px;
      border: 1px solid var(--color-border-primary);
      border-radius: 6px;
      background: var(--color-background-secondary);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--color-background-info);
      color: var(--color-text-inverse);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 13px;
      flex-shrink: 0;
    }
    .meta { min-width: 0; }
    .user {
      font-weight: 600;
      color: var(--color-text-primary);
    }
    .sub {
      font-size: 12px;
      color: var(--color-text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #message {
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0 0 10px;
    }
    button {
      appearance: none;
      border: 1px solid var(--color-border-primary);
      background: var(--color-background-primary);
      color: var(--color-text-primary);
      border-radius: 4px;
      padding: 6px 10px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover { background: var(--color-background-secondary); }
    #raw {
      display: none;
      margin: 10px 0 0;
      padding: 8px;
      border-radius: 4px;
      background: var(--color-background-primary);
      border: 1px solid var(--color-border-primary);
      color: var(--color-text-secondary);
      font-size: 11px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 180px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div id="status"></div>
  <div id="card">
    <div class="header">
      <div class="avatar" id="avatar">?</div>
      <div class="meta">
        <div class="user" id="username"></div>
        <div class="sub" id="subtitle"></div>
      </div>
    </div>
    <p id="message" data-testid="preview-post-message"></p>
    <button type="button" data-testid="preview-post-toggle" id="toggle"></button>
    <pre id="raw" data-testid="preview-post-raw"></pre>
  </div>
  <script>
(function () {
  // Current SUPPORTED_PROTOCOL_VERSIONS from @modelcontextprotocol/ext-apps.
  var ADVERTISED_PROTOCOL_VERSION = '2026-01-26';
  var negotiatedProtocolVersion = ADVERTISED_PROTOCOL_VERSION;

  var STRINGS = {
    en: {
      connecting: 'Connecting…',
      unknown: 'unknown',
      rawToolResult: 'Raw tool result',
      showRaw: 'Show raw JSON',
      hideRaw: 'Hide raw JSON',
      initFailed: 'Host handshake failed'
    }
  };

  var statusEl = document.getElementById('status');
  var cardEl = document.getElementById('card');
  var avatarEl = document.getElementById('avatar');
  var usernameEl = document.getElementById('username');
  var subtitleEl = document.getElementById('subtitle');
  var messageEl = document.getElementById('message');
  var rawEl = document.getElementById('raw');
  var toggleEl = document.getElementById('toggle');
  var rawText = '';
  var showingRaw = false;
  var localeTag = 'en';

  function t(key) {
    var table = STRINGS[localeTag] || STRINGS.en;
    return table[key] || STRINGS.en[key] || key;
  }

  function applyLocale(locale) {
    if (typeof locale === 'string' && locale) {
      localeTag = locale.split('-')[0].toLowerCase();
      if (!STRINGS[localeTag]) {
        localeTag = 'en';
      }
      document.documentElement.lang = locale;
    } else {
      document.documentElement.lang = 'en';
      localeTag = 'en';
    }
    statusEl.textContent = t('connecting');
    usernameEl.textContent = '@' + t('unknown');
    toggleEl.textContent = showingRaw ? t('hideRaw') : t('showRaw');
  }

  applyLocale('en');

  function post(msg) {
    window.parent.postMessage(msg, '*');
  }

  function applyHostStyles(variables) {
    if (!variables || typeof variables !== 'object') return;
    var root = document.documentElement;
    Object.keys(variables).forEach(function (key) {
      if (typeof variables[key] === 'string' && variables[key]) {
        root.style.setProperty(key, variables[key]);
      }
    });
  }

  function reportSize() {
    post({
      jsonrpc: '2.0',
      method: 'ui/notifications/size-changed',
      params: {height: document.documentElement.scrollHeight}
    });
  }

  function formatDate(ms) {
    if (!ms) return '';
    try {
      return new Date(ms).toLocaleString(document.documentElement.lang || undefined);
    } catch (e) {
      return String(ms);
    }
  }

  function renderPreview(text) {
    rawText = text || '';
    rawEl.textContent = rawText;
    var data;
    try {
      data = JSON.parse(rawText);
    } catch (e) {
      statusEl.style.display = 'none';
      cardEl.style.display = 'block';
      usernameEl.textContent = t('rawToolResult');
      subtitleEl.textContent = '';
      avatarEl.textContent = '!';
      messageEl.textContent = rawText;
      reportSize();
      return;
    }

    var username = data.username || t('unknown');
    var channel = data.channel_display_name || '';
    var created = formatDate(data.create_at);
    usernameEl.textContent = '@' + username;
    avatarEl.textContent = (username.charAt(0) || '?').toUpperCase();
    subtitleEl.textContent = [channel, created].filter(Boolean).join(' · ');
    messageEl.textContent = data.message || '';
    statusEl.style.display = 'none';
    cardEl.style.display = 'block';
    reportSize();
  }

  toggleEl.addEventListener('click', function () {
    showingRaw = !showingRaw;
    rawEl.style.display = showingRaw ? 'block' : 'none';
    toggleEl.textContent = showingRaw ? t('hideRaw') : t('showRaw');
    reportSize();
  });

  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(function () {
      reportSize();
    }).observe(document.documentElement);
  }

  window.addEventListener('message', function (event) {
    if (event.source !== window.parent) {
      return;
    }
    var data = event.data;
    if (!data || typeof data !== 'object') return;

    if (data.id === 1) {
      if (data.error) {
        statusEl.textContent = t('initFailed');
        statusEl.style.display = 'block';
        cardEl.style.display = 'none';
        reportSize();
        return;
      }
      if (data.result) {
        if (typeof data.result.protocolVersion === 'string' && data.result.protocolVersion) {
          negotiatedProtocolVersion = data.result.protocolVersion;
        }
        var hostContext = data.result.hostContext || {};
        if (hostContext.theme) {
          document.documentElement.dataset.theme = hostContext.theme;
        }
        if (hostContext.styles && hostContext.styles.variables) {
          applyHostStyles(hostContext.styles.variables);
        }
        applyLocale(hostContext.locale);
        post({jsonrpc: '2.0', method: 'ui/notifications/initialized'});
      }
      return;
    }

    if (data.method === 'ui/notifications/tool-input') {
      return;
    }

    if (data.method === 'ui/notifications/tool-result') {
      // AppBridge.sendToolResult passes CallToolResult as params directly.
      var result = data.params || {};
      var content = Array.isArray(result.content) ? result.content : [];
      var text = '';
      for (var i = 0; i < content.length; i++) {
        if (content[i] && content[i].type === 'text' && typeof content[i].text === 'string') {
          text = content[i].text;
          break;
        }
      }
      renderPreview(text);
    }
  });

  post({
    jsonrpc: '2.0',
    id: 1,
    method: 'ui/initialize',
    params: {
      protocolVersion: ADVERTISED_PROTOCOL_VERSION,
      appInfo: {name: 'preview-post', version: '1.0.0'},
      appCapabilities: {}
    }
  });
})();
  </script>
</body>
</html>
