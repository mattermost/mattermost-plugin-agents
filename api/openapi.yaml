---
openapi: 3.0.0
info:
  version: 0.1.0
  title: Agents Plugin API
  description: HTTP API for the Mattermost Agents plugin.
  contact:
    name: Mattermost
    url: https://mattermost.com/
    email: support@mattermost.com
servers:
  - url: http://localhost:8065
tags:
  - name: AgentsPluginAgents
    description: User-created AI agents
  - name: AgentsPluginBridge
    description: Inter-plugin LLM bridge endpoints
  - name: AgentsPluginChannels
    description: Channel analysis endpoints
  - name: AgentsPluginConversations
    description: Conversation history endpoints
  - name: AgentsPluginCustomPrompts
    description: Custom prompt endpoints
  - name: AgentsPluginMCP
    description: Model Context Protocol endpoints
  - name: AgentsPluginAdmin
    description: System administrator endpoints
  - name: AgentsPluginPosts
    description: Post action endpoints
  - name: AgentsPluginSearch
    description: Semantic search endpoints
paths:
  /plugins/mattermost-ai/bridge/v1/agents:
    get:
      tags:
        - AgentsPluginBridge
      summary: List bridge agents
      description: Returns the Agents plugin bots available through the inter-plugin LLM bridge.
      operationId: agentsPluginBridgeListAgents
      security:
        - AgentsPluginInterPluginAuth: []
      parameters:
        - $ref: "#/components/parameters/AgentsPluginUserIDQuery"
      responses:
        "200":
          description: Agents returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentsPluginBridgeAgentsResponse"
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "500":
          $ref: "#/components/responses/AgentsPluginInternalServerError"
  /plugins/mattermost-ai/bridge/v1/services:
    get:
      tags:
        - AgentsPluginBridge
      summary: List bridge services
      description: Returns the LLM services available through the inter-plugin LLM bridge.
      operationId: agentsPluginBridgeListServices
      security:
        - AgentsPluginInterPluginAuth: []
      parameters:
        - $ref: "#/components/parameters/AgentsPluginUserIDQuery"
      responses:
        "200":
          description: Services returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentsPluginBridgeServicesResponse"
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "500":
          $ref: "#/components/responses/AgentsPluginInternalServerError"
  /plugins/mattermost-ai/bridge/v1/completion/agent/{agent}:
    post:
      tags:
        - AgentsPluginBridge
      summary: Stream a bridge completion from an agent
      description: Starts an LLM completion for the specified agent and streams Server-Sent Events.
      operationId: agentsPluginBridgeCompleteAgentStream
      security:
        - AgentsPluginInterPluginAuth: []
      parameters:
        - $ref: "#/components/parameters/AgentsPluginAgentPath"
      requestBody:
        $ref: "#/components/requestBodies/AgentsPluginBridgeCompletionRequest"
      responses:
        "200":
          $ref: "#/components/responses/AgentsPluginSSEStream"
        "400":
          $ref: "#/components/responses/AgentsPluginBridgeError"
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "403":
          $ref: "#/components/responses/AgentsPluginBridgeError"
        "404":
          $ref: "#/components/responses/AgentsPluginBridgeError"
        "500":
          $ref: "#/components/responses/AgentsPluginBridgeError"
  /plugins/mattermost-ai/bridge/v1/completion/agent/{agent}/nostream:
    post:
      tags:
        - AgentsPluginBridge
      summary: Complete from an agent without streaming
      description: Runs an LLM completion for the specified agent and returns the final text.
      operationId: agentsPluginBridgeCompleteAgentNoStream
      security:
        - AgentsPluginInterPluginAuth: []
      parameters:
        - $ref: "#/components/parameters/AgentsPluginAgentPath"
      requestBody:
        $ref: "#/components/requestBodies/AgentsPluginBridgeCompletionRequest"
      responses:
        "200":
          description: Completion returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentsPluginCompletionResponse"
        "400":
          $ref: "#/components/responses/AgentsPluginBridgeError"
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "403":
          $ref: "#/components/responses/AgentsPluginBridgeError"
        "404":
          $ref: "#/components/responses/AgentsPluginBridgeError"
        "500":
          $ref: "#/components/responses/AgentsPluginBridgeError"
  /plugins/mattermost-ai/bridge/v1/completion/service/{service}:
    post:
      tags:
        - AgentsPluginBridge
      summary: Stream a bridge completion from a service
      description: Starts an LLM completion using a bot backed by the specified service and streams Server-Sent Events.
      operationId: agentsPluginBridgeCompleteServiceStream
      security:
        - AgentsPluginInterPluginAuth: []
      parameters:
        - $ref: "#/components/parameters/AgentsPluginServicePath"
      requestBody:
        $ref: "#/components/requestBodies/AgentsPluginBridgeCompletionRequest"
      responses:
        "200":
          $ref: "#/components/responses/AgentsPluginSSEStream"
        "400":
          $ref: "#/components/responses/AgentsPluginBridgeError"
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "403":
          $ref: "#/components/responses/AgentsPluginBridgeError"
        "404":
          $ref: "#/components/responses/AgentsPluginBridgeError"
        "500":
          $ref: "#/components/responses/AgentsPluginBridgeError"
  /plugins/mattermost-ai/bridge/v1/completion/service/{service}/nostream:
    post:
      tags:
        - AgentsPluginBridge
      summary: Complete from a service without streaming
      description: Runs an LLM completion using a bot backed by the specified service and returns the final text.
      operationId: agentsPluginBridgeCompleteServiceNoStream
      security:
        - AgentsPluginInterPluginAuth: []
      parameters:
        - $ref: "#/components/parameters/AgentsPluginServicePath"
      requestBody:
        $ref: "#/components/requestBodies/AgentsPluginBridgeCompletionRequest"
      responses:
        "200":
          description: Completion returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentsPluginCompletionResponse"
        "400":
          $ref: "#/components/responses/AgentsPluginBridgeError"
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "403":
          $ref: "#/components/responses/AgentsPluginBridgeError"
        "404":
          $ref: "#/components/responses/AgentsPluginBridgeError"
        "500":
          $ref: "#/components/responses/AgentsPluginBridgeError"
  /plugins/mattermost-ai/mcp-server/.well-known/oauth-protected-resource:
    get:
      tags:
        - AgentsPluginMCP
      summary: Get MCP OAuth protected resource metadata
      description: Returns OAuth protected resource metadata for the plugin-hosted MCP server when it is enabled.
      operationId: agentsPluginGetMCPProtectedResourceMetadata
      responses:
        "200":
          description: OAuth protected resource metadata.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/AgentsPluginNotFound"
        "500":
          $ref: "#/components/responses/AgentsPluginInternalServerError"
  /plugins/mattermost-ai/mcp-server/mcp:
    get:
      tags:
        - AgentsPluginMCP
      summary: Open an MCP server stream
      description: Handles the GET side of the plugin-hosted MCP Streamable HTTP transport.
      operationId: agentsPluginMCPServerGet
      security:
        - AgentsPluginBearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/AgentsPluginSSEStream"
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "500":
          $ref: "#/components/responses/AgentsPluginInternalServerError"
    post:
      tags:
        - AgentsPluginMCP
      summary: Send an MCP message
      description: Handles the POST side of the plugin-hosted MCP Streamable HTTP transport.
      operationId: agentsPluginMCPServerPost
      security:
        - AgentsPluginBearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: MCP response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "202":
          description: MCP message accepted.
        "400":
          $ref: "#/components/responses/AgentsPluginBadRequest"
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "500":
          $ref: "#/components/responses/AgentsPluginInternalServerError"
    delete:
      tags:
        - AgentsPluginMCP
      summary: Close an MCP server stream
      description: Handles the DELETE side of the plugin-hosted MCP Streamable HTTP transport.
      operationId: agentsPluginMCPServerDelete
      security:
        - AgentsPluginBearerAuth: []
      responses:
        "200":
          description: MCP stream closed.
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "500":
          $ref: "#/components/responses/AgentsPluginInternalServerError"
  /plugins/mattermost-ai/conversations/{conversationid}:
    get:
      tags:
        - AgentsPluginConversations
      summary: Get a conversation
      description: Returns a conversation and its turns, filtering sensitive content when the requester is not the conversation owner.
      operationId: agentsPluginGetConversation
      security:
        - AgentsPluginBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgentsPluginConversationIDPath"
      responses:
        "200":
          description: Conversation returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentsPluginConversationResponse"
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "403":
          $ref: "#/components/responses/AgentsPluginForbidden"
        "404":
          $ref: "#/components/responses/AgentsPluginNotFound"
        "500":
          $ref: "#/components/responses/AgentsPluginInternalServerError"
  /plugins/mattermost-ai/oauth/callback:
    get:
      tags:
        - AgentsPluginMCP
      summary: Complete an MCP OAuth callback
      description: Completes a user-scoped MCP OAuth flow and returns a small HTML page that closes the OAuth window.
      operationId: agentsPluginOAuthCallback
      security:
        - AgentsPluginBearerAuth: []
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/AgentsPluginHTMLPage"
        "400":
          $ref: "#/components/responses/AgentsPluginHTMLPage"
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "500":
          $ref: "#/components/responses/AgentsPluginHTMLPage"
  /plugins/mattermost-ai/ai_threads:
    get:
      tags:
        - AgentsPluginConversations
      summary: List AI thread summaries
      description: Returns recent conversation summaries for the authenticated user.
      operationId: agentsPluginListAIThreads
      security:
        - AgentsPluginBearerAuth: []
      responses:
        "200":
          description: Thread summaries returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentsPluginAIThread"
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "500":
          $ref: "#/components/responses/AgentsPluginInternalServerError"
  /plugins/mattermost-ai/ai_bots:
    get:
      tags:
        - AgentsPluginAgents
      summary: List AI bots visible to the user
      description: Returns bot metadata and feature flags used by the webapp.
      operationId: agentsPluginListAIBots
      security:
        - AgentsPluginBearerAuth: []
      responses:
        "200":
          description: Bots returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentsPluginAIBotsResponse"
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "500":
          $ref: "#/components/responses/AgentsPluginInternalServerError"
  /plugins/mattermost-ai/mcp/tools:
    get:
      tags:
        - AgentsPluginMCP
      summary: List user MCP tools
      description: Returns MCP tool providers and tools visible to the authenticated user.
      operationId: agentsPluginListUserMCPTools
      security:
        - AgentsPluginBearerAuth: []
      responses:
        "200":
          description: MCP tools returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentsPluginUserMCPToolsResponse"
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "500":
          $ref: "#/components/responses/AgentsPluginInternalServerError"
  /plugins/mattermost-ai/mcp/oauth/{serverName}/start:
    get:
      tags:
        - AgentsPluginMCP
      summary: Start MCP OAuth
      description: Starts an OAuth flow for the named MCP server and redirects the user to the provider.
      operationId: agentsPluginStartMCPOAuth
      security:
        - AgentsPluginBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgentsPluginServerNamePath"
        - name: resource_metadata
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the MCP authorization URL.
          headers:
            Location:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/AgentsPluginHTMLPage"
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "404":
          $ref: "#/components/responses/AgentsPluginHTMLPage"
        "500":
          $ref: "#/components/responses/AgentsPluginHTMLPage"
  /plugins/mattermost-ai/mcp/user-preferences:
    get:
      tags:
        - AgentsPluginMCP
      summary: Get MCP user preferences
      description: Returns the authenticated user's MCP tool provider preferences.
      operationId: agentsPluginGetMCPUserPreferences
      security:
        - AgentsPluginBearerAuth: []
      responses:
        "200":
          description: Preferences returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentsPluginMCPUserPreferences"
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "500":
          $ref: "#/components/responses/AgentsPluginInternalServerError"
    put:
      tags:
        - AgentsPluginMCP
      summary: Replace MCP user preferences
      description: Replaces the authenticated user's MCP tool provider preferences.
      operationId: agentsPluginPutMCPUserPreferences
      security:
        - AgentsPluginBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentsPluginMCPUserPreferences"
      responses:
        "200":
          description: Preferences saved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentsPluginMCPUserPreferences"
        "400":
          $ref: "#/components/responses/AgentsPluginBadRequest"
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "413":
          $ref: "#/components/responses/AgentsPluginTooLarge"
        "500":
          $ref: "#/components/responses/AgentsPluginInternalServerError"
  /plugins/mattermost-ai/mcp/oauth/{serverName}:
    delete:
      tags:
        - AgentsPluginMCP
      summary: Disconnect MCP OAuth
      description: Deletes the authenticated user's stored OAuth token for the named MCP server.
      operationId: agentsPluginDisconnectMCPOAuth
      security:
        - AgentsPluginBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgentsPluginServerNamePath"
      responses:
        "200":
          description: OAuth token disconnected.
        "400":
          $ref: "#/components/responses/AgentsPluginBadRequest"
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "500":
          $ref: "#/components/responses/AgentsPluginInternalServerError"
  /plugins/mattermost-ai/agents:
    post:
      tags:
        - AgentsPluginAgents
      summary: Create an agent
      description: Creates a user-managed AI agent and its backing bot account.
      operationId: agentsPluginCreateAgent
      security:
        - AgentsPluginBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentsPluginCreateAgentRequest"
      responses:
        "201":
          description: Agent created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentsPluginBotConfig"
        "400":
          $ref: "#/components/responses/AgentsPluginBadRequest"
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "403":
          $ref: "#/components/responses/AgentsPluginForbidden"
        "409":
          $ref: "#/components/responses/AgentsPluginConflict"
        "413":
          $ref: "#/components/responses/AgentsPluginTooLarge"
        "500":
          $ref: "#/components/responses/AgentsPluginInternalServerError"
    get:
      tags:
        - AgentsPluginAgents
      summary: List agents
      description: Returns the agents the authenticated user may access.
      operationId: agentsPluginListAgents
      security:
        - AgentsPluginBearerAuth: []
      responses:
        "200":
          description: Agents returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentsPluginBotConfig"
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "500":
          $ref: "#/components/responses/AgentsPluginInternalServerError"
  /plugins/mattermost-ai/agents/models/fetch:
    post:
      tags:
        - AgentsPluginAgents
      summary: Fetch models for a configured service
      description: Fetches available model IDs using credentials already stored in the plugin configuration.
      operationId: agentsPluginFetchModelsForService
      security:
        - AgentsPluginBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentsPluginFetchModelsForServiceRequest"
      responses:
        "200":
          description: Models returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentsPluginModelInfo"
        "400":
          $ref: "#/components/responses/AgentsPluginBadRequest"
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "403":
          $ref: "#/components/responses/AgentsPluginForbidden"
        "500":
          $ref: "#/components/responses/AgentsPluginInternalServerError"
  /plugins/mattermost-ai/agents/{agentid}:
    get:
      tags:
        - AgentsPluginAgents
      summary: Get an agent
      description: Returns one agent if it exists and is visible to the authenticated user.
      operationId: agentsPluginGetAgent
      security:
        - AgentsPluginBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgentsPluginAgentIDPath"
      responses:
        "200":
          description: Agent returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentsPluginBotConfig"
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "404":
          $ref: "#/components/responses/AgentsPluginNotFound"
        "500":
          $ref: "#/components/responses/AgentsPluginInternalServerError"
    put:
      tags:
        - AgentsPluginAgents
      summary: Update an agent
      description: Fully replaces mutable fields on an existing agent.
      operationId: agentsPluginUpdateAgent
      security:
        - AgentsPluginBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgentsPluginAgentIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentsPluginUpdateAgentRequest"
      responses:
        "200":
          description: Agent updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentsPluginBotConfig"
        "400":
          $ref: "#/components/responses/AgentsPluginBadRequest"
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "403":
          $ref: "#/components/responses/AgentsPluginForbidden"
        "404":
          $ref: "#/components/responses/AgentsPluginNotFound"
        "413":
          $ref: "#/components/responses/AgentsPluginTooLarge"
        "500":
          $ref: "#/components/responses/AgentsPluginInternalServerError"
    delete:
      tags:
        - AgentsPluginAgents
      summary: Delete an agent
      description: Soft-deletes an agent and deactivates its backing bot account.
      operationId: agentsPluginDeleteAgent
      security:
        - AgentsPluginBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgentsPluginAgentIDPath"
      responses:
        "200":
          description: Agent deleted successfully.
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "403":
          $ref: "#/components/responses/AgentsPluginForbidden"
        "404":
          $ref: "#/components/responses/AgentsPluginNotFound"
        "500":
          $ref: "#/components/responses/AgentsPluginInternalServerError"
  /plugins/mattermost-ai/agents/{agentid}/avatar:
    post:
      tags:
        - AgentsPluginAgents
      summary: Upload an agent avatar
      description: Uploads a profile image for an agent's backing bot account.
      operationId: agentsPluginUploadAgentAvatar
      security:
        - AgentsPluginBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgentsPluginAgentIDPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "200":
          description: Avatar uploaded successfully.
        "400":
          $ref: "#/components/responses/AgentsPluginBadRequest"
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "403":
          $ref: "#/components/responses/AgentsPluginForbidden"
        "404":
          $ref: "#/components/responses/AgentsPluginNotFound"
        "413":
          $ref: "#/components/responses/AgentsPluginTooLarge"
        "500":
          $ref: "#/components/responses/AgentsPluginInternalServerError"
  /plugins/mattermost-ai/services:
    get:
      tags:
        - AgentsPluginAgents
      summary: List configurable AI services
      description: Returns non-secret fields for configured AI services.
      operationId: agentsPluginListServices
      security:
        - AgentsPluginBearerAuth: []
      responses:
        "200":
          description: Services returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentsPluginServiceInfo"
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "403":
          $ref: "#/components/responses/AgentsPluginForbidden"
        "500":
          $ref: "#/components/responses/AgentsPluginInternalServerError"
  /plugins/mattermost-ai/search/raw:
    post:
      tags:
        - AgentsPluginSearch
      summary: Run raw semantic search
      description: Returns enriched semantic search results without LLM processing.
      operationId: agentsPluginRawSearch
      security:
        - AgentsPluginBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentsPluginRawSearchRequest"
      responses:
        "200":
          description: Search results returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentsPluginRawSearchResponse"
        "400":
          $ref: "#/components/responses/AgentsPluginJSONError"
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "503":
          $ref: "#/components/responses/AgentsPluginJSONError"
        "500":
          $ref: "#/components/responses/AgentsPluginJSONError"
  /plugins/mattermost-ai/custom-prompts:
    post:
      tags:
        - AgentsPluginCustomPrompts
      summary: Create a custom prompt
      description: Creates a custom prompt for the authenticated user.
      operationId: agentsPluginCreateCustomPrompt
      security:
        - AgentsPluginBearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/AgentsPluginCustomPromptCreate"
      responses:
        "201":
          description: Custom prompt created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentsPluginCustomPrompt"
        "400":
          $ref: "#/components/responses/AgentsPluginBadRequest"
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "500":
          $ref: "#/components/responses/AgentsPluginInternalServerError"
    get:
      tags:
        - AgentsPluginCustomPrompts
      summary: List custom prompts
      description: Returns all custom prompts visible to the authenticated user.
      operationId: agentsPluginListCustomPrompts
      security:
        - AgentsPluginBearerAuth: []
      responses:
        "200":
          description: Custom prompts returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentsPluginCustomPrompt"
        "401":
          $ref: "#/components/responses/AgentsPluginUnauthorized"
        "500":
          $ref: "#/components/responses/AgentsPluginInternalServerError"
  /plugins/mattermost-ai/custom-prompts/{id}:
    put:
      tags:
        - AgentsPluginCustomPrompts
      summary: Update a custom prompt
      description: Updates an existing custom prompt owned by the authenticated user.
      operationId: agentsPluginUpdateCustomPrompt
      security:
        - AgentsPluginBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgentsPluginPromptIDPath"
      requestBody:
        $ref: "#/components/requestBodies/AgentsPluginCustomPromptUpdate"
      responses:
        "204":
          description: Custom prompt updated successfully.
        "400":
