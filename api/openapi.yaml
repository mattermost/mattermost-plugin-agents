components:
  securitySchemes:
    AgentsPluginBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
    AgentsPluginInterPluginAuth:
      type: apiKey
      in: header
      name: Mattermost-Plugin-ID
  parameters:
    AgentsPluginAgentPath:
      name: agent
      in: path
      required: true
      description: Mattermost user ID of the agent bot.
      schema:
        type: string
    AgentsPluginServicePath:
      name: service
      in: path
      required: true
      description: Service ID or service name.
      schema:
        type: string
    AgentsPluginAgentIDPath:
      name: agentid
      in: path
      required: true
      description: Agent ID.
      schema:
        type: string
    AgentsPluginChannelIDPath:
      name: channelid
      in: path
      required: true
      description: Mattermost channel ID.
      schema:
        type: string
    AgentsPluginConversationIDPath:
      name: conversationid
      in: path
      required: true
      description: Conversation ID.
      schema:
        type: string
    AgentsPluginFileIDPath:
      name: fileid
      in: path
      required: true
      description: Mattermost file ID.
      schema:
        type: string
    AgentsPluginPostIDPath:
      name: postid
      in: path
      required: true
      description: Mattermost post ID.
      schema:
        type: string
    AgentsPluginPromptIDPath:
      name: id
      in: path
      required: true
      description: Custom prompt ID.
