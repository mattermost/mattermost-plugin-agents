name: "plugin-ci/build-fips"
description: |
  Build and verify the FIPS Linux/amd64 variant of this plugin.

  Temporarily inlined here to validate the composite end-to-end before it
  lands in mattermost/actions (mattermost/actions#57). When that PR merges
  this directory is deleted and the workflow switches to
  `mattermost/actions/plugin-ci/build-fips@<sha>`.

  Requires the calling job to grant `id-token: write` for setup-chainctl
  OIDC. Caller uploads the produced `dist-fips/*.tar.gz`.

inputs:
  chainguard-identity:
    description: "Chainguard identity ID to authenticate against cgr.dev."
    required: true

runs:
  using: "composite"
  steps:
    - name: chainctl/auth
      uses: chainguard-dev/setup-chainctl@67a753db49c7e97fed4c76fbe809b1339b11facf
      with:
        identity: ${{ inputs.chainguard-identity }}

    - name: build-fips
      shell: bash
      run: make dist-fips

    - name: verify-fips
      shell: bash
      run: make verify-fips
