name: ci
on:
  push:
    branches:
      - master
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:

permissions:
  contents: write

# Set the CI_RUNNER repository or organization variable to a larger runner label
# for the heavier e2e path jobs. Other CI jobs intentionally stay on the
# standard GitHub-hosted Ubuntu runner.
jobs:
  e2e-build-artifact:
    timeout-minutes: 30
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v6
      with:
        node-version: 24.11.0
    - name: Build plugin bundle for e2e jobs
      run: make dist
    - uses: actions/upload-artifact@v4
      with:
        name: e2e-plugin-dist
        path: ./dist/*.tar.gz
        retention-days: 1

  e2e:
    needs: e2e-build-artifact
    timeout-minutes: 60
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: shard-1
            group: e2e-shard-1
          - name: shard-2
            group: e2e-shard-2
          - name: shard-3
            group: e2e-shard-3
          - name: shard-4
            group: e2e-shard-4
    name: e2e-${{ matrix.shard.name }}
    env:
      # Needs 11.11+ for plugin EvaluateAccessControl (mattermost#37509).
      MM_IMAGE: ${{ vars.MM_IMAGE || 'mattermost/mattermost-enterprise-edition:latest' }}
    defaults:
      run:
        working-directory: ./e2e
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v6
      with:
        node-version: 24.11.0
    - uses: actions/download-artifact@v4
      with:
        name: e2e-plugin-dist
        path: ./dist/
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Validate CI test groups
      run: node ./scripts/ci-test-groups.mjs validate
    - name: Run Playwright tests for ${{ matrix.shard.name }}
      shell: bash
      run: |
        SPEC_OUTPUT="$(node ./scripts/ci-test-groups.mjs list "${{ matrix.shard.group }}")"
        [[ -n "${SPEC_OUTPUT}" ]]
        mapfile -t SPEC_FILES <<<"${SPEC_OUTPUT}"
        npx playwright test --project=chromium "${SPEC_FILES[@]}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-${{ matrix.shard.name }}
        path: ./e2e/playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: server-logs-${{ matrix.shard.name }}
        path: ./e2e/logs/server-logs.log
        retention-days: 30

  plugin-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: mmuser
          POSTGRES_PASSWORD: mostest
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run tests
        env:
          PG_ROOT_DSN: "postgres://mmuser:mostest@localhost:5432/postgres?sslmode=disable"
          MM_SERVICESETTINGS_ENABLEDEVELOPER: true
        run: |
          make test

  # Skips evals for pull requests that only touch files that cannot change
  # agent behavior, so their PRs get neither eval runs nor eval comments.
  eval-changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The pull_request checkout is a merge commit; its first parent is the base.
          changed=$(git diff --name-only HEAD^1 HEAD)
          if [ -n "$changed" ] && grep -qvE '^(webapp/|e2e/|docs/|loadtest/|assets/|img/)|\.md$' <<< "$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # Runs on pull requests and on master; master results are the baseline that
  # pull request results are compared against.
  evals:
    needs: eval-changes
    if: needs.eval-changes.outputs.run == 'true'
    uses: ./.github/workflows/evals.yml
    with:
      runs: ${{ vars.EVAL_RUNS || '1' }}
    secrets: inherit

  evals-comment:
    runs-on: ubuntu-latest
    needs: [eval-changes, evals]
    if: always() && github.event_name == 'pull_request' && needs.eval-changes.outputs.run == 'true'
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Download evaluation results
        # No artifact exists when the evals job failed before uploading; the
        # report then lists every provider as unavailable.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: eval-results-*
          path: eval-results

      - name: Find master baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        # The newest master push run whose eval jobs all succeeded (a failed
        # eval job has partial results) and whose eval results are unexpired.
        # Other jobs of the run may fail.
        run: |
          run_id=""
          repo="repos/${{ github.repository }}"
          for id in $(gh api "$repo/actions/workflows/ci.yml/runs?branch=master&event=push&status=completed&per_page=20" --jq '.workflow_runs[].id'); do
            evals_ok=$(gh api "$repo/actions/runs/$id/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name | startswith("evals / evals-"))] | length > 0 and all(.conclusion == "success")')
            [ "$evals_ok" = true ] || continue
            artifacts=$(gh api "$repo/actions/runs/$id/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.expired == false and (.name | startswith("eval-results-")))] | length')
            if [ "$artifacts" -gt 0 ]; then
              run_id=$id
              break
            fi
          done
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download master baseline
        if: steps.baseline.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: eval-results-*
          path: eval-baseline
          run-id: ${{ steps.baseline.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Load existing eval comment
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.github/scripts/post-eval-comment.js');
            await script.saveEvalComment(github, context, 'previous-comment.md');

      - name: Build report
        run: |
          make evalviewer
          ./bin/evalviewer report \
            --results eval-results \
            --baseline eval-baseline \
            --providers openai,anthropic,azure,mistral,bedrock \
            --previous previous-comment.md \
            --comment comment.md \
            --summary summary.md \
            --commit "${{ github.event.pull_request.head.sha }}" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post or resolve pull request comment
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.github/scripts/post-eval-comment.js');
            await script.postEvalComment(github, context, 'comment.md');

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - uses: mattermost/actions/plugin-ci/lint@main

  verify-no-drift:
    name: Verify webapp i18n, package-lock, and editor contract are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Install webapp dependencies
        run: cd webapp && npm ci
      - name: Check webapp i18n catalog drift
        run: make check-i18n
      - name: Check package-lock.json drift
        run: make check-locks
      - name: Check editor contract against the pinned host snapshot
        run: cd webapp && npm run check-editor-contract

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: mattermost/actions/plugin-ci/setup@main
        with:
          golangci-lint-version: "v1.54.2"
      - uses: mattermost/actions/plugin-ci/build@main
      # plugin-ci/build wrote dist/release-notes.md as a plain commit list under
      # "Fixes". On release tags, replace it with notes written from the PR
      # titles and descriptions (see build/releasenotes/README.md). The tool
      # leaves the file untouched when it fails, so the commit list stays as the
      # fallback and the build still succeeds. Mattermost's release pipeline
      # reads the file from the all-plugin-artifacts upload below.
      - name: build/release-notes
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES_MODEL: ${{ vars.RELEASE_NOTES_MODEL || vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
        run: make release-notes OUTPUT=dist/release-notes.md
      - uses: mattermost/actions/plugin-ci/build-fips@c7a06bc642f72fc227deb2cae3af03cff72c0f0d
        with:
          chainguard-identity: ${{ secrets.CHAINGUARD_IDENTITY }}
      - name: build/upload-all
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: all-plugin-artifacts
          path: |
            dist/*.tar.gz
            dist/release-notes.md
            dist-fips/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # The nested Go modules (loadtest/controller, build/releasenotes) are invisible
  # to the root-module lint/build jobs above, so run their lint, tests, and go.mod
  # drift checks in a dedicated job.
  nested-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - run: make install-go-tools
      - run: make nested-modules-build nested-modules-lint nested-modules-test nested-modules-mod-check

  upload-s3-pr:
    needs: [lint]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: ci/get-short-sha
        id: short-sha
        run: echo "sha=$(echo ${{ github.event.pull_request.head.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build plugin
        run: make dist-ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload dist to S3
        run: |
          aws s3 cp dist/mattermost-ai-*.tar.gz s3://${{ secrets.AWS_S3_BUCKET }}/mattermost-plugin-agents/mattermost-plugin-agents-${{ steps.short-sha.outputs.sha }}.tar.gz

  deploy:
    needs: [lint, build, plugin-tests, e2e]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build plugin
        run: make dist

      - name: Update latest-master release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PLUGIN_FILE=$(ls dist/*.tar.gz)
          # Get the commit message and hash
          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_HASH=$(git rev-parse --short HEAD)

          # Delete the old release if it exists
          gh release delete latest-master --yes || true

          # Delete the old tag if it exists
          git tag -d latest-master || true
          git push origin :refs/tags/latest-master || true

          # Create new tag and release
          git tag latest-master
          git push origin latest-master

          gh release create latest-master \
            --title "Latest Master Build" \
            --notes "Latest build from master branch - ${COMMIT_HASH}" \
            --prerelease \
            $PLUGIN_FILE

      - name: Deploy to Mattermost instances
        env:
          MM_SERVERS_CONFIG: ${{ secrets.MM_SERVERS_CONFIG }}
        run: |
          PLUGIN_FILE=$(ls dist/*.tar.gz)
          echo "Found plugin bundle: $PLUGIN_FILE"

          echo "$MM_SERVERS_CONFIG" | jq -c '.[]' | while read -r server; do
            url=$(echo "$server" | jq -r '.url')
            token=$(echo "$server" | jq -r '.token')

            echo "Deploying to $url"
            curl -H "Authorization: Bearer $token" \
                 -X POST \
                 -F "plugin=@$PLUGIN_FILE" \
                 -F "force=true" \
                 "$url/api/v4/plugins"
          done
