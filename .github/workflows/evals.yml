name: evals

# Runs the LLM evals once per provider and uploads each provider's evals.jsonl
# as the eval-results-<provider> artifact. Called by ci.yml for pull requests
# and master, and by nightly-evals.yml.
on:
  workflow_call:
    inputs:
      runs:
        description: Runs per eval, combined by majority vote in the report.
        type: string
        default: '1'

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider:
          - name: openai
            display_name: OpenAI
          - name: anthropic
            display_name: Anthropic
          - name: azure
            display_name: Azure OpenAI
          - name: mistral
            display_name: Mistral
            # Run packages one at a time to stay under Mistral's rate limits.
            parallel: '1'
          - name: bedrock
            display_name: AWS Bedrock
    name: evals-${{ matrix.provider.name }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run ${{ matrix.provider.display_name }} evaluations
        # Model variables are optional overrides; when unset, the defaults in
        # evals/evals.go apply so there is a single place to bump models.
        env:
          LLM_PROVIDER: ${{ matrix.provider.name }}
          EVAL_TEST_PARALLEL: ${{ matrix.provider.parallel }}
          # Runs per eval, combined by majority vote in the report.
          GOEVALS: ${{ inputs.runs }}
          # OpenAI
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          # Anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          # Azure
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_MODEL: ${{ vars.AZURE_OPENAI_MODEL }}
          # Mistral
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
          # AWS Bedrock
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_BEDROCK_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_BEDROCK_ACCESS_KEY_SECRET }}
          AWS_BEDROCK_REGION: ${{ vars.AWS_BEDROCK_REGION || 'us-east-1' }}
          AWS_BEDROCK_MODEL: ${{ vars.AWS_BEDROCK_MODEL }}
          # Grader
          GRADER_LLM_MODEL: ${{ vars.GRADER_LLM_MODEL }}
          # Failed evals are left to the caller's report job. This job fails only
          # when evals did not all run, so partial results never become a baseline.
          EVALS_REPORT_ONLY: '1'
        run: make evals-ci

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ matrix.provider.name }}
          path: evals.jsonl
          if-no-files-found: ignore
          retention-days: 30
